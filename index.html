<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1c1c1e; color: #fff; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0;
                 border-radius: 10px; border: none; background: #2ea6ff;
                 color: #fff; font-size: 16px; }
    </style>
</head>
<body>
    <h3>Выберите вариант:</h3>
    <button onclick="pick('album')">Детский альбом с фотографиями😻</button>
    <button onclick="pick('parents')">Фото родителей Голубики-Луны</button>
    <button onclick="pick('buy')">Купить котенка</button>

    <script>
        function pick(v) {
            Telegram.WebApp.sendData(v);
            Telegram.WebApp.close();
        }
    </script>
</body>
</html>
